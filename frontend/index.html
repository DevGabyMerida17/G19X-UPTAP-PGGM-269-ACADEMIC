<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Onboarding PluriOne</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
<script>
  // Aplica el tema antes de dibujar la página para evitar un destello claro.
  (function () {
    var tema = null;
    try { tema = localStorage.getItem("p1_tema"); } catch (e) {}
    if (tema !== "claro" && tema !== "oscuro") {
      tema = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "oscuro" : "claro";
    }
    document.documentElement.setAttribute("data-tema", tema);
  })();
</script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
