# Migraciones de la base de datos (Alembic). La conexión se toma de DATABASE_URL en backend/.env.
# Crear una migración nueva después de cambiar models.py:
#   alembic revision --autogenerate -m "descripcion"
# Aplicarlas (el backend también lo hace solo al arrancar):
#   alembic upgrade head
[alembic]
script_location = %(here)s/migraciones
prepend_sys_path = .
path_separator = os
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
